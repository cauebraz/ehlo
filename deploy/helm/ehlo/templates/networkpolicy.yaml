{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ehlo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ehlo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ehlo.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.networkPolicy.from }}
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- else }}
    []
    {{- end }}
{{- end }}
