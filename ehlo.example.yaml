# ehlo server configuration. Omitted keys take the defaults in docs/limits.md.
# Durations use Go syntax (30s, 10m).

listen: ":8080"

# Warmup state. A relative path resolves from the working directory.
state_path: data/warmup.json

# Sources whose metrics should exist at zero before their first event.
sources: [mx-1, mx-2, mx-3, mx-4]

targets:
  # Daily volume each source grows toward. 0 leaves a source unmanaged.
  default: 200000
  # Share of a source's volume per provider. Each unlisted provider may use
  # the whole rest (here 15%, or 30000), so the targets can sum past default.
  mix: {gmail: 0.55, outlook: 0.20, yahoo: 0.10}
  # Sources that start at full volume instead of warming up.
  warm: [mx-1, mx-2, mx-3, mx-4]
  # Per-source overrides.
  # sources:
  #   mx-5: {daily: 50000}

# Every key and default is explained in docs/limits.md.
warmup:
  start_limit: 50                 # first day's limit for a new lane
  growth: {default: 1.4, gmail: 1.5, outlook: 1.3, yahoo: 1.35}
  grow_when_used: 0.7             # a lane grows only after sending 70% of its limit
  hold_complaint_ratio: 0.001     # stop growing at 0.1% complaints
  pause_complaint_ratio: 0.003    # pause the lane at 0.3%
  hold_bounce_ratio: 0.03
  hours_per_day: 16               # a warming lane may send limit/16 per policy hour (day_length/24)
  backoff:                        # within the day
    ratio: 0.05                   # rate limit replies over attempts, 5 minutes, at least 5 of them
    duration: 10m
    block_ratio: 0.01             # reputation block replies end the lane's day

# Recipient domain to provider. The built-in list covers Gmail, Outlook,
# Yahoo, iCloud and about 25 regional providers. Entries here replace it,
# so name every provider that growth, shaping or mix names, defaults
# included (gmail, outlook, yahoo, icloud), or the server does not start.
# Other domains count as "other". To add domains, use providers_extra.
# providers:
#   - name: gmail
#     domains: [gmail.com, googlemail.com, .google.com]
#   - name: outlook
#     domains: [outlook.com, hotmail.com, live.com, msn.com]
#   - name: yahoo
#     domains: [yahoo.com, ymail.com, aol.com]
#   - name: icloud
#     domains: [icloud.com, me.com, mac.com]

# Rules added after the built-in list (or after providers, when set). For a
# domain both list, the entry here wins. A leading dot matches subdomains.
# Use it for Google Workspace or Microsoft 365 tenants you send to.
# providers_extra:
#   - name: gmail
#     domains: [customer.example]
#   - name: outlook
#     domains: [.tenant.example]

# Distinct sources ingest accepts. Events from more sources are rejected.
# max_sources: 256

# Routes accepted beyond self_hosted, ses and sendgrid.
# routes: [postmark]

# Webhook authentication. Read the token from your secret store; do not
# commit it.
# webhooks:
#   token: ""                    # webhook URLs then need ?token=<value>
#   sendgrid_public_key: ""      # from SendGrid's Signed Event Webhook settings
#   token_file: /run/secrets/ehlo-webhook-token           # instead of token
#   sendgrid_public_key_file: /run/secrets/sendgrid-key    # instead of sendgrid_public_key
