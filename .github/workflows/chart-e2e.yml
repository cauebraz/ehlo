name: chart-e2e

on:
  pull_request:
    paths:
      - deploy/**
      - grafana/**
      - prometheus/**
      - monitoring/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile
      - .github/workflows/chart-e2e.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - grafana/**
      - prometheus/**
      - monitoring/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile
      - .github/workflows/chart-e2e.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: chart-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KUBECTL_VERSION: v1.37.2
  KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4

jobs:
  kind:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install kind and kubectl
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          curl -fsSL -o "$bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          printf '%s  %s\n' "$KIND_SHA256" "$bin/kind" "$KUBECTL_SHA256" "$bin/kubectl" | sha256sum -c -
          chmod +x "$bin/kind" "$bin/kubectl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: kind e2e
        run: deploy/scripts/kind-e2e.sh
