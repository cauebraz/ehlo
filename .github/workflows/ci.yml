name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: ./scripts/check.sh

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/*/go.sum
      - name: golangci-lint
        run: go tool -modfile=tools/golangci-lint/go.mod golangci-lint run
      - name: govulncheck
        run: go tool -modfile=tools/govulncheck/go.mod govulncheck ./...
      - name: actionlint
        run: go tool -modfile=tools/actionlint/go.mod actionlint
      - name: goreleaser check
        run: go tool -modfile=tools/goreleaser/go.mod goreleaser check

  chart:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: helm lint, template, kubeconform
        run: deploy/scripts/chart-check.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: start the stack
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only
        run: docker compose up -d --build --wait
      - name: smoke
        run: |
          for _ in 1 2 3 4 5 6; do
            sleep 30
            if ./scripts/smoke.sh; then exit 0; fi
          done
          exit 1
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 200
